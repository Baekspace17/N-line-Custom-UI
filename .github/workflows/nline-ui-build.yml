name: N-line Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub ubuntu-latest already provides Android SDK command-line tools.
      # Do not call android-actions/setup-android@v3: its legacy 'tools'
      # installation request fails on current SDK repositories.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package NEMESIS
        shell: bash
        run: python3 tools/build_nline_package.py

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: N-line-Custom-UI
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/nlinecustomui.zip
          if-no-files-found: error
